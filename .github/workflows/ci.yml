name: ci

# Lint and test on every pull request and every push to main; release.yml calls it as its gate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only superseded pull request runs are cancelled; a push to main or a release gate always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # make lint: shellcheck on w.sh and install.sh (as sh) and on the bats suites. Uses the runner image's
    # shellcheck (not pinned); the version is printed for the log.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck version
        run: shellcheck --version
      - run: make lint

  test:
    # make test: the bats suites (w.sh, install.sh, build-release.sh) and the zsh suite (w.zsh).
    # Tests that need tmux start a private server under their own TMUX_TMPDIR and stop it in teardown (the
    # others stub tmux); stdin is /dev/null and output a pipe, so a hang is a bug; timeout-minutes bounds it anyway.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bats and zsh (ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bats zsh
      - name: Install bats and GNU tar (macOS; zsh ships with macOS)
        if: runner.os == 'macOS'
        run: |
          command -v bats >/dev/null 2>&1 || brew install bats-core
          command -v gtar >/dev/null 2>&1 || brew install gnu-tar
      - name: Tool versions
        run: |
          bats --version
          zsh --version
          git --version
      - name: make test
        timeout-minutes: 15
        run: make test < /dev/null

  shells:
    # make shells on Ubuntu LTS: the bats suites with w.sh, install.sh and build-release.sh run under dash,
    # bash --posix, busybox ash and bash (TEST_SH, tests/shell-under-test.bash; bats itself runs under bash),
    # then the zsh suite. 24.04 is the oldest LTS in the support floor, ubuntu-latest whatever image GitHub
    # maps it to (22.04 is not a leg: its runner image is deprecated, unsupported from 2027-04-17). CI=true: a
    # shell named in SHELLS that is missing fails the job, it is never skipped.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bats, dash, busybox and zsh
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bats dash busybox zsh
      - name: Shell and tool versions
        run: |
          bats --version
          bash --version | head -n 1
          dpkg-query -W dash busybox zsh
          git --version
      - name: make shells
        timeout-minutes: 25
        run: make shells < /dev/null
      - name: zsh suite (w.zsh)
        run: zsh tests/test-w.zsh < /dev/null

  shells-macos:
    # The macOS legs: stock /bin/sh and /bin/bash (bash 3.2, the bash floor), /bin/bash --posix, and dash from
    # Homebrew on BSD userland; then the zsh suite under /bin/zsh. busybox has no Homebrew formula, so busybox
    # ash runs only on Ubuntu. macos-15 is the oldest macOS in the support floor (the macos-14 image was
    # retired on 2026-11-02), macos-latest the latest. Intel macOS (macos-15-intel) is not a leg.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bats, dash and GNU tar (build-release.sh)
        run: |
          command -v bats >/dev/null 2>&1 || brew install bats-core
          command -v dash >/dev/null 2>&1 || brew install dash
          command -v gtar >/dev/null 2>&1 || brew install gnu-tar
      - name: Shell and tool versions
        run: |
          sw_vers
          bats --version
          /bin/bash --version | head -n 1
          /bin/sh -c 'echo "/bin/sh: ${BASH_VERSION:-not bash}"'
          /bin/zsh --version
          git --version
      - name: make shells
        timeout-minutes: 35
        run: make shells SHELLS="/bin/sh,/bin/bash,/bin/bash --posix,dash" < /dev/null
      - name: zsh suite (w.zsh, /bin/zsh)
        run: /bin/zsh tests/test-w.zsh < /dev/null

  tmux:
    # make test-tmux: only the real-tmux tests (exact `=name` targets, session-name rewriting), once per tmux:
    # the floor, 2.1 (built from the release tarball, checksum pinned: 1.9a and 2.0 have no `=name` targets),
    # the Ubuntu packages (24.04: 3.4, and ubuntu-latest's) and Homebrew's current tmux on macos-latest. The
    # 2.1 build covers the old-tmux floor whatever the runner OS.
    # The tests start their own tmux server under a private TMUX_TMPDIR and stop it in teardown.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "2.1 (floor, from source)", os: ubuntu-24.04, source: "2.1", sha256: "31564e7bf4bcef2defb3cb34b9e596bd43a3937cad9e5438701a81a5a9af6176" }
          - { name: "apt (ubuntu-24.04)", os: ubuntu-24.04 }
          - { name: "apt (ubuntu-latest)", os: ubuntu-latest }
          - { name: "brew (macos-latest)", os: macos-latest }
    name: tmux ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bats and tmux (ubuntu)
        if: runner.os == 'Linux'
        env:
          TMUX_SOURCE: ${{ matrix.source }}
          TMUX_SHA256: ${{ matrix.sha256 }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bats
          if [ -n "$TMUX_SOURCE" ]; then
            sudo apt-get install -y -q build-essential libevent-dev libncurses-dev
            sh scripts/build-tmux.sh "$TMUX_SOURCE" "$TMUX_SHA256" "$RUNNER_TEMP/tmux-bin"
            echo "TMUX_BIN=$RUNNER_TEMP/tmux-bin/tmux" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y -q tmux
            echo "TMUX_BIN=$(command -v tmux)" >> "$GITHUB_ENV"
          fi
      - name: Install bats and tmux (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v bats >/dev/null 2>&1 || brew install bats-core
          command -v tmux >/dev/null 2>&1 || brew install tmux
          echo "TMUX_BIN=$(command -v tmux)" >> "$GITHUB_ENV"
      - name: make test-tmux
        timeout-minutes: 10
        run: make test-tmux TMUX_BIN="$TMUX_BIN" < /dev/null
